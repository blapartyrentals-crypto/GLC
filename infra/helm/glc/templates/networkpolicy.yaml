{{- if .Values.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "glc.name" . }}-ingress
spec:
  podSelector:
    matchLabels:
      app: {{ include "glc.name" . }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: glc-ingress
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- end }}